<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Entries — Superadmin — WorkTrack</title>
  <link rel="icon" href="/static/assets/apple-icon.jpeg">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link rel="stylesheet" href="/static/css/superadmin.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body class="sa-body">
  <div class="sa-shell">
    <div id="sa-sidebar-mount"></div>

    <main class="sa-main">
      <div class="sa-page-header">
        <div>
          <a href="/superadmin/" class="sa-back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
            Dashboard
          </a>
          <h1 class="sa-page-title">Work Entries</h1>
          <p class="sa-page-subtitle">Every logged work entry, across every company.</p>
        </div>
        <div class="sa-header-actions">
          <button class="sa-btn sa-btn-outline" onclick="loadWorkEntries()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            Refresh
          </button>
        </div>
      </div>

      <div class="sa-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search by employee, project, or company...">
      </div>

      <div class="sa-panel">
        <div class="sa-panel-header">
          <span class="sa-panel-title">All Work Entries</span>
          <span class="sa-count-pill" id="countPill">0 entries</span>
        </div>
        <div class="sa-table-wrap">
          <table class="sa-table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Company</th>
                <th>Project</th>
                <th>Date</th>
                <th>Status</th>
                <th>Review</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="entriesBody">
              <tr class="sa-empty-row"><td colspan="7">Loading work entries…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Generic Edit Modal (driven by SA_ENTITY_CONFIGS in superadmin.js) -->
  <div id="saEditModal" class="sa-modal-backdrop" style="display:none;">
    <div class="sa-modal">
      <div class="sa-modal-header">
        <div>
          <div class="sa-modal-sub" id="saEditModalSub">Editing</div>
          <div class="sa-modal-title" id="saEditModalTitle">Record</div>
        </div>
        <button class="sa-modal-close" onclick="saCloseModal('saEditModal')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <form id="saEditForm">
        <div class="sa-modal-body">
          <div class="sa-error-box" id="saEditError"></div>
          <div id="saEditNote" class="sa-hint" style="margin-bottom:1rem;"></div>
          <div id="saEditFields"></div>
        </div>
        <div class="sa-modal-footer">
          <button type="button" class="sa-btn sa-btn-danger" id="saEditDeleteBtn" onclick="saConfirmDeleteCurrent()">Delete</button>
          <div style="display:flex;gap:0.6rem;">
            <button type="button" class="sa-btn sa-btn-outline" onclick="saCloseModal('saEditModal')">Cancel</button>
            <button type="submit" class="sa-btn sa-btn-primary">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/superadmin.js"></script>
  <script>
    saRenderSidebar('work-entries');

    let allEntries = [];

    function actionCell(editCall) {
      return `<div class="sa-cell-actions">
        <button class="sa-icon-btn" onclick="${editCall}" title="Edit">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg>
        </button>
      </div>`;
    }

    function renderEntries(list) {
      const tbody = document.getElementById('entriesBody');
      document.getElementById('countPill').textContent = `${list.length} entr${list.length === 1 ? 'y' : 'ies'}`;

      if (!list.length) {
        tbody.innerHTML = `<tr class="sa-empty-row"><td colspan="7">No work entries found.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((w) => `
        <tr>
          <td>${saEscape(w.employee_name)}</td>
          <td>${saEscape(w.company_name)}</td>
          <td>${saEscape(w.project_name)}</td>
          <td>${saDate(w.date)}</td>
          <td><span class="sa-badge ${saStatusBadgeClass(w.status)}">${saStatusLabel(w.status)}</span></td>
          <td><span class="sa-badge ${saStatusBadgeClass(w.review_status)}">${saStatusLabel(w.review_status)}</span></td>
          <td>${actionCell(`saOpenEditor('workentry', ${w.id}, { onSaved: loadWorkEntries, onDeleted: loadWorkEntries })`)}</td>
        </tr>
      `).join('');
    }

    async function loadWorkEntries() {
      document.getElementById('entriesBody').innerHTML = `<tr class="sa-empty-row"><td colspan="7">Loading work entries…</td></tr>`;
      try {
        allEntries = await saGet(API_CONFIG.ENDPOINTS.SUPERADMIN_WORK_ENTRIES);
        renderEntries(allEntries);
      } catch (e) {
        saToast(e.message, 'error');
        document.getElementById('entriesBody').innerHTML = `<tr class="sa-empty-row"><td colspan="7">Failed to load work entries.</td></tr>`;
      }
    }

    document.getElementById('searchInput').addEventListener('input', saDebounce((e) => {
      const q = e.target.value.trim().toLowerCase();
      renderEntries(!q ? allEntries : allEntries.filter((w) =>
        (w.employee_name || '').toLowerCase().includes(q) ||
        (w.project_name || '').toLowerCase().includes(q) ||
        (w.company_name || '').toLowerCase().includes(q)
      ));
    }, 200));

    loadWorkEntries();
  </script>
</body>
</html>
