<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Report - WorkTrack</title>
  <link rel="icon" href="/static/assets/apple-icon.jpeg">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/animations.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link rel="stylesheet" href="/static/css/bubble-background.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body class="bg-background">
  <!-- Mobile Sidebar Toggle -->
  <button id="mobileMenuToggle" class="hidden fixed top-4 left-4 z-40 p-2 rounded-lg bg-white border border-slate-200 shadow-sm hover:bg-slate-50 transition-colors">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Mobile Backdrop -->
  <div id="mobileBackdrop" class="hidden fixed inset-0 bg-black/40 z-20 lg:hidden"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed left-0 top-0 h-screen border-r border-white/10 p-4 flex flex-col z-30 lg:relative lg:z-10 shadow-xl transition-all duration-300 -translate-x-full lg:translate-x-0 w-64"
    style="background-image: linear-gradient(rgba(20,16,31,0.9), rgba(20,16,31,0.9)), url('/static/assets/backgrounds/wave-dark.jpg'); background-size: cover; background-position: center;">
    <!-- Logo -->
    <div class="mb-6 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 min-w-0">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 font-black text-white text-sm shadow-lg"
          style="background: linear-gradient(135deg, #8b5cf6, #d946ef);"
          id="sidebarLogo">
          HA
        </div>
        <span class="font-black text-base text-white leading-tight break-words" id="sidebarCompanyName">HAEGL</span>
      </a>
    </div>

    <!-- Role Badge -->
    <div class="mb-6">
      <div class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold border bg-pink-500/15 border-pink-400/30 text-pink-200">
        <span class="w-2 h-2 rounded-full animate-pulse bg-pink-400"></span>
        Employee
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-1">
      <a href="worklog.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all group relative overflow-hidden text-slate-300 hover:text-white hover:bg-white/10">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <span class="font-medium text-sm">Work Log</span>
      </a>
      <a href="submit-report.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all group relative overflow-hidden bg-gradient-to-r from-cyan-500/25 to-blue-500/25 border border-cyan-400/30 text-white">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span class="font-medium text-sm">Submit Report</span>
      </a>
      <a href="my-reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all group relative overflow-hidden text-slate-300 hover:text-white hover:bg-white/10">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span class="font-medium text-sm">My Reports</span>
      </a>
      <a href="chat.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all group relative overflow-hidden text-slate-300 hover:text-white hover:bg-white/10">
        <div class="relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span id="chatBadge" class="hidden absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 flex items-center justify-center rounded-full bg-red-500 text-white text-[10px] font-bold leading-none"></span>
        </div>
        <span class="font-medium text-sm">Chat</span>
      </a>
      <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all group relative overflow-hidden text-slate-300 hover:text-white hover:bg-white/10">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="font-medium text-sm">Profile</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="border-t border-white/10 pt-4">
      <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:text-rose-300 hover:bg-rose-400/10 transition-all group">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="font-medium text-sm">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6 lg:p-8">
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <div class="mb-8">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-black text-slate-900">Submit Daily Report</h1>
            <p class="text-slate-600">Share your progress and achievements with your team</p>
          </div>
        </div>
      </div>

      <!-- Report Form -->
      <div class="card">
        <form id="reportForm" class="space-y-6">
          <!-- Date -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Report Date</label>
            <input type="date" id="reportDate" class="input" required>
          </div>

          <!-- Tasks Completed -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Tasks Completed</label>
            <div id="tasksCompleted" class="space-y-2">
              <div class="flex items-center gap-2">
                <input type="text" class="input" placeholder="Enter a task you completed">
                <button type="button" onclick="removeTask(this)" class="btn btn-xs btn-destructive">✕</button>
              </div>
            </div>
            <button type="button" onclick="addTaskField('tasksCompleted')" class="btn btn-sm btn-outline mt-2">+ Add Task</button>
          </div>

          <!-- Tasks In Progress -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Tasks In Progress</label>
            <div id="tasksInProgress" class="space-y-2">
              <div class="flex items-center gap-2">
                <input type="text" class="input" placeholder="Enter a task you're working on">
                <button type="button" onclick="removeTask(this)" class="btn btn-xs btn-destructive">✕</button>
              </div>
            </div>
            <button type="button" onclick="addTaskField('tasksInProgress')" class="btn btn-sm btn-outline mt-2">+ Add Task</button>
          </div>

          <!-- Blockers -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Blockers / Challenges</label>
            <div id="blockers" class="space-y-2">
              <div class="flex items-center gap-2">
                <input type="text" class="input" placeholder="Any blockers or challenges you faced?">
                <button type="button" onclick="removeTask(this)" class="btn btn-xs btn-destructive">✕</button>
              </div>
            </div>
            <button type="button" onclick="addTaskField('blockers')" class="btn btn-sm btn-outline mt-2">+ Add Blocker</button>
          </div>

          <!-- Hours Worked -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Hours Worked Today</label>
            <input type="number" id="hoursWorked" class="input" placeholder="e.g., 8" min="0" step="0.25" required>
          </div>

          <!-- Additional Comments -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Additional Comments</label>
            <textarea id="comments" class="textarea" rows="4" placeholder="Any other updates or notes..."></textarea>
          </div>

          <!-- Submit Button -->
          <div class="flex items-center gap-3">
            <button type="submit" class="btn btn-gradient-employee">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              Submit Report
            </button>
            <button type="button" onclick="saveDraft()" class="btn btn-outline">Save as Draft</button>
          </div>
        </form>
      </div>

      <!-- Draft Section -->
      <div id="draftSection" class="card mt-6 hidden">
        <div class="card-header">
          <h3 class="card-title">Saved Draft</h3>
        </div>
        <div class="card-content">
          <p class="text-sm text-slate-600">You have a saved draft from <span id="draftDate"></span></p>
          <div class="flex gap-2 mt-3">
            <button onclick="loadDraft()" class="btn btn-sm btn-primary">Load Draft</button>
            <button onclick="clearDraft()" class="btn btn-sm btn-destructive">Clear Draft</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script>
    // Authentication check
    requireEmployee();

    // Set today's date as default
    document.getElementById('reportDate').valueAsDate = new Date();

    // Check for saved draft
    checkDraft();

    // Add task field
    function addTaskField(containerId) {
      const container = document.getElementById(containerId);
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2 animate-fadeIn';
      div.innerHTML = `
        <input type="text" class="input" placeholder="${getPlaceholder(containerId)}">
        <button type="button" onclick="removeTask(this)" class="btn btn-xs btn-destructive">✕</button>
      `;
      container.appendChild(div);
    }

    // Remove task field
    function removeTask(button) {
      const container = button.parentElement;
      const parent = container.parentElement;
      if (parent.children.length > 1) {
        container.remove();
      } else {
        container.querySelector('input').value = '';
      }
    }

    // Get placeholder based on container
    function getPlaceholder(containerId) {
      switch(containerId) {
        case 'tasksCompleted': return 'Enter a task you completed';
        case 'tasksInProgress': return "Enter a task you're working on";
        case 'blockers': return 'Any blockers or challenges you faced?';
        default: return 'Enter value';
      }
    }

    // Collect tasks from container
    function collectTasks(containerId) {
      const container = document.getElementById(containerId);
      const inputs = container.querySelectorAll('input');
      const tasks = [];
      inputs.forEach(input => {
        if (input.value.trim()) {
          tasks.push(input.value.trim());
        }
      });
      return tasks;
    }

    // Form submission
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        date: document.getElementById('reportDate').value,
        tasks_completed: collectTasks('tasksCompleted'),
        tasks_in_progress: collectTasks('tasksInProgress'),
        blockers: collectTasks('blockers'),
        hours_worked: parseFloat(document.getElementById('hoursWorked').value),
        comments: document.getElementById('comments').value
      };

      try {
        await submitReport(data);
        showToast('Report submitted successfully!', 'success');
        document.getElementById('reportForm').reset();
        document.getElementById('reportDate').valueAsDate = new Date();
        clearDraft();
      } catch (error) {
        showToast('Failed to submit report', 'error');
      }
    });

    // Save draft
    function saveDraft() {
      const draft = {
        date: document.getElementById('reportDate').value,
        tasksCompleted: collectTasks('tasksCompleted'),
        tasksInProgress: collectTasks('tasksInProgress'),
        blockers: collectTasks('blockers'),
        hoursWorked: document.getElementById('hoursWorked').value,
        comments: document.getElementById('comments').value,
        savedAt: new Date().toISOString()
      };

      setStorageItem('reportDraft', draft);
      showToast('Draft saved!', 'success');
      checkDraft();
    }

    // Load draft
    function loadDraft() {
      const draft = getStorageItem('reportDraft');

      if (!draft) return;

      document.getElementById('reportDate').value = draft.date || '';
      document.getElementById('hoursWorked').value = draft.hoursWorked || '';
      document.getElementById('comments').value = draft.comments || '';

      // Load tasks
      loadTasksIntoContainer('tasksCompleted', draft.tasksCompleted);
      loadTasksIntoContainer('tasksInProgress', draft.tasksInProgress);
      loadTasksIntoContainer('blockers', draft.blockers);

      showToast('Draft loaded!', 'success');
    }

    // Load tasks into container
    function loadTasksIntoContainer(containerId, tasks) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (!tasks || tasks.length === 0) {
        addTaskField(containerId);
        return;
      }

      tasks.forEach(task => {
        const div = document.createElement('div');
        div.className = 'flex items-center gap-2 animate-fadeIn';
        div.innerHTML = `
          <input type="text" class="input" placeholder="${getPlaceholder(containerId)}" value="${task}">
          <button type="button" onclick="removeTask(this)" class="btn btn-xs btn-destructive">✕</button>
        `;
        container.appendChild(div);
      });
    }

    // Clear draft
    function clearDraft() {
      removeStorageItem('reportDraft');
      checkDraft();
    }

    // Check for draft
    function checkDraft() {
      const draft = getStorageItem('reportDraft');
      const draftSection = document.getElementById('draftSection');

      if (draft) {
        draftSection.classList.remove('hidden');
        document.getElementById('draftDate').textContent = formatDate(draft.savedAt, 'datetime');
      } else {
        draftSection.classList.add('hidden');
      }
    }

    // Toast notification
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <div class="toast-icon">
          ${type === 'success' ? '✓' : '⚠'}
        </div>
        <div class="toast-content">
          <div class="toast-title">${type === 'success' ? 'Success' : 'Error'}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
      `;

      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
  </script>
<script src="/static/js/bubble-background.js"></script>
</body>
</html>
