<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Sign In - WorkTrack</title>
  <link rel="icon" href="/static/assets/apple-icon.jpeg">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/animations.css">
  <link rel="stylesheet" href="/static/css/utilities.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #faf8ff 0%, #f0f9ff 35%, #fef6fb 70%, #f3fdf9 100%);
      min-height: 100vh;
      position: relative;
    }

    /* Animated Background */
    .animated-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      animation: float 10s ease-in-out infinite;
    }

    .bg-bubble-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(196,181,253,0.35), transparent 70%);
      top: -10%;
      left: -10%;
      animation-delay: 0s;
      animation-name: float1;
    }

    .bg-bubble-2 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(251,207,232,0.35), transparent 70%);
      top: 5%;
      right: -8%;
      animation-delay: 2s;
      animation-name: float2;
    }

    .bg-bubble-3 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(186,230,253,0.35), transparent 70%);
      bottom: -5%;
      left: 20%;
      animation-delay: 4s;
      animation-name: float3;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, 30px) scale(1.08); }
      50% { transform: translate(0, 40px) scale(1); }
      75% { transform: translate(-30px, 20px) scale(1.05); }
    }

    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-30px, 40px) scale(1.1); }
      50% { transform: translate(0, 40px) scale(1); }
      75% { transform: translate(-30px, 20px) scale(1.05); }
    }

    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -25px) scale(1.05); }
      50% { transform: translate(0, -40px) scale(1); }
      75% { transform: translate(30px, 20px) scale(1.05); }
    }

    /* Main Container */
    .main-container {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    /* Back Button */
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #64748b;
      font-size: 0.875rem;
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: all 0.2s ease;
      border: none;
      background: none;
      cursor: pointer;
    }

    .back-button:hover {
      color: #1e293b;
      transform: translateX(-4px);
    }

    /* Role Badge */
    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0891b2;
      margin-bottom: 1.5rem;
    }

    .role-badge svg {
      width: 12px;
      height: 12px;
    }

    /* Auth Card */
    .auth-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
      animation: scaleIn 0.5s ease-out;
    }

    /* Header */
    .auth-header {
      margin-bottom: 1.5rem;
    }

    .auth-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e1b2e;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      font-size: 0.875rem;
      color: #64748b;
    }

    /* Form */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 0.375rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #06b6d4;
      pointer-events: none;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    .form-input {
      width: 100%;
      padding: 0.625rem 1rem;
      padding-left: 2.5rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #1e293b;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .password-toggle:hover {
      color: #64748b;
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Submit Button */
    .submit-button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .submit-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(6, 182, 212, 0.35);
    }

    .submit-button:active {
      transform: scale(0.98);
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .submit-button svg {
      width: 16px;
      height: 16px;
    }

    /* Loading Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-message {
      display: none;
      padding: 0.75rem;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 0.75rem;
      color: #991b1b;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      align-items: center;
      gap: 0.5rem;
    }

    .error-message.show {
      display: flex;
    }

    .error-message svg {
      width: 16px;
      height: 16px;
    }

    /* Info Box */
    .info-box {
      padding: 1rem;
      background: #ecfeff;
      border: 1px solid #cffafe;
      border-radius: 0.75rem;
      margin-top: 1.5rem;
    }

    .info-box p {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 640px) {
      body {
        padding: 0.5rem;
        padding-top: 1.5rem;
      }

      .main-container {
        max-width: 100%;
        padding: 0;
      }

      .auth-card {
        padding: 1.25rem;
        border-radius: 1.25rem;
      }

      .back-button {
        margin-bottom: 1rem;
        font-size: 0.8125rem;
      }

      .role-badge {
        font-size: 0.6875rem;
        padding: 0.3125rem 0.625rem;
        margin-bottom: 1rem;
      }

      .auth-header {
        margin-bottom: 1.25rem;
      }

      .auth-header h2 {
        font-size: 1.25rem;
      }

      .auth-header p {
        font-size: 0.8125rem;
      }

      .form-group {
        margin-bottom: 0.875rem;
      }

      .form-group label {
        font-size: 0.6875rem;
      }

      .form-input {
        font-size: 16px;
        padding: 0.625rem 0.75rem;
        padding-left: 2.25rem;
      }

      .submit-button {
        padding: 0.6875rem;
        font-size: 0.9375rem;
      }

      .info-box {
        padding: 0.875rem;
        margin-top: 1.25rem;
      }

      .info-box p {
        font-size: 0.6875rem;
      }

      /* Bubbles smaller on mobile */
      .bg-bubble-1 {
        width: 300px;
        height: 300px;
      }

      .bg-bubble-2 {
        width: 250px;
        height: 250px;
      }

      .bg-bubble-3 {
        width: 220px;
        height: 220px;
      }
    }

    @media (max-width: 400px) {
      .auth-card {
        padding: 1rem;
      }

      .auth-header h2 {
        font-size: 1.125rem;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="bg-bubble bg-bubble-1"></div>
    <div class="bg-bubble bg-bubble-2"></div>
    <div class="bg-bubble bg-bubble-3"></div>
  </div>

  <div class="main-container">
    <div class="auth-container">
      <button class="back-button" onclick="window.location.href='/'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to role selection
      </button>

      <div class="role-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Employee Sign In
      </div>

      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <h2>👋 Welcome back</h2>
          <p>Sign in with credentials provided by your admin</p>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="errorText"></span>
        </div>

        <!-- Form -->
        <form id="loginForm" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </div>
              <input type="email" class="form-input" id="email" placeholder="employee@gmail.com" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper">
              <div class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <input type="password" class="form-input" id="password" placeholder="••••••••" required>
              <button type="button" class="password-toggle" onclick="togglePassword()">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-button" id="submitBtn">
            <span id="btnText">Sign In</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </form>

        <!-- Info Box -->
        <div class="info-box">
          <p>
            🔐 Your login credentials are provided by your Admin / Manager.<br>
            Contact your admin if you don't have access.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let showPassword = false;

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      showPassword = !showPassword;

      if (showPassword) {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorMessage.classList.add('show');
    }

    function hideError() {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.classList.remove('show');
    }

    async function handleSubmit(event) {
      event.preventDefault();
      hideError();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');

      submitBtn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div> Signing in...';

      try {
        const response = await fetch('/api/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.error) {
          showError(data.error);
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
          return;
        }

        // Store auth data
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('is_admin', data.is_admin);
        // company_name was never being stored here before — this is why
        // every employee saw the default 'HAEGL' name in the sidebar
        // instead of the company they actually belong to.
        if (data.company_name) {
          localStorage.setItem('company_name', data.company_name);
          window.dispatchEvent(new Event('company-name-updated'));
        }
        // Redirect based on user role
        if (data.is_superuser) {
          window.location.href = '/superadmin/';
        } else if (data.is_admin) {
          showError('Please use Employee Login.');
          submitBtn.disabled = false;
          btnText.textContent = 'Sign In';
        } else {
          window.location.href = '/employee/worklog/';
        }
      } catch (error) {
        showError('Connection failed. Make sure the server is running.');
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
