<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin Console - WorkTrack{% endblock %}</title>
  <link rel="icon" href="/static/assets/apple-icon.jpeg">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/animations.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link rel="stylesheet" href="/static/css/bubble-background.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  {% block extra_css %}{% endblock %}
  <style>
    .admin-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      height: calc(100vh - 2rem);
      margin: -1rem;
      padding: 1rem;
      background-image: url('/static/assets/backgrounds/wave-light.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    @media (max-width: 640px) {
      .admin-container {
        height: auto;
        min-height: calc(100vh - 2rem);
        padding: 0.75rem;
        margin: -0.75rem;
      }
    }

    .admin-header {
      position: relative;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .admin-header-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('/static/assets/backgrounds/wave-dark.jpg');
      background-size: cover;
      background-position: center;
    }

    .admin-header-content {
      position: relative;
      z-index: 10;
      padding: 0.75rem 1.25rem;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.625rem;
      border-radius: 0.5rem;
      border: 1px solid;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-badge svg {
      width: 0.75rem;
      height: 0.75rem;
    }

    .main-table-card {
      background: white;
      border-radius: 1rem;
      border: 1px solid rgb(229, 231, 235);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      background: white;
      border-bottom: 1px solid rgb(243, 244, 246);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .table-container {
      overflow: auto;
      flex: 1;
    }

    .worklog-table th {
      position: sticky;
      top: 0;
      background: rgb(249, 250, 251);
      border-bottom: 2px solid rgb(229, 231, 235);
      z-index: 10;
    }

    .team-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      flex-wrap: wrap;
    }

    .team-bar-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(30,41,59,0.85), rgba(30,41,59,0.85)), url('/static/assets/backgrounds/wave-dark.jpg');
      background-size: cover;
      background-position: center bottom;
    }

    .team-bar-content {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .employee-chip {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      transition: all 0.2s;
      cursor: pointer;
    }

    .employee-chip:hover {
      transform: scale(1.05);
    }

    .employee-chip.active {
      box-shadow: 0 0 0 2px white, 0 0 0 4px currentColor;
    }

    /* Auth Guard Styles */
    .auth-guard {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }

    .auth-guard-content {
      text-align: center;
      color: white;
    }

    .auth-guard-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Bubble Background */
    .bubble-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -100px;
      background: radial-gradient(circle at 30% 70%, rgba(139, 92, 246, 0.4), rgba(217, 70, 239, 0.2));
      border-radius: 50%;
      animation: bubble-rise linear infinite;
      pointer-events: none;
    }

    @keyframes bubble-rise {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) translateX(100px);
        opacity: 0;
      }
    }
  </style>
  {% block page_css %}{% endblock %}
</head>
<body class="bg-background">
  <!-- Auth Guard -->
  <div id="authGuard" class="auth-guard">
    <div class="auth-guard-content">
      <div class="auth-guard-spinner"></div>
      <p class="text-lg font-semibold">Verifying access...</p>
    </div>
  </div>

  <!-- Bubble Background -->
  <div class="bubble-container" id="bubbleContainer"></div>

  {% include "partials/sidebar.html" %}

  <!-- Main Content -->
  <div class="admin-container" style="display: none;" id="mainContent">
    {% block content %}{% endblock %}
  </div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/bubble-background.js"></script>

  <script>
    // Authentication Guard
    (function() {
      const authGuard = document.getElementById('authGuard');
      const mainContent = document.getElementById('mainContent');

      async function verifyAccess() {
        try {
          const user = await verifyAuth();

          if (!user) {
            // Not authenticated - redirect to home
            window.location.href = '/';
            return;
          }

          if (!user.is_admin) {
            // Not admin - redirect to employee dashboard
            window.location.href = '/employee/worklog/';
            return;
          }

          // Admin verified - show content
          authGuard.style.display = 'none';
          mainContent.style.display = 'flex';

          // Initialize components
          if (typeof initSidebar === 'function') {
            initSidebar();
          }
          if (typeof initBubbles === 'function') {
            initBubbles();
          }

        } catch (error) {
          console.error('Auth verification failed:', error);
          window.location.href = '/';
        }
      }

      // Start verification
      verifyAccess();
    })();

    // Update greeting and time
    function updateDateTime() {
      const greeting = getGreeting();
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
      const dateStr = now.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      const greetingEmoji = document.getElementById('greetingEmoji');
      const greetingText = document.getElementById('greetingText');
      const currentTime = document.getElementById('currentTime');
      const currentDate = document.getElementById('currentDate');

      if (greetingEmoji) greetingEmoji.textContent = greeting.emoji;
      if (greetingText) greetingText.textContent = greeting.text + ', Admin!';
      if (currentTime) currentTime.textContent = timeStr;
      if (currentDate) currentDate.textContent = dateStr;
    }

    // Update time every second
    setInterval(updateDateTime, 1000);
    updateDateTime();
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
